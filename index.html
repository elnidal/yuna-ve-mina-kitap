<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yuna ve Mina: OPTCAS'ın Sırrı</title>
<style>
  :root{--ink:#3a2f4a;--card:#fffaf0;--blue:#4fc3f7;--pink:#ff8fb1}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px;
    font-family:"Chalkboard SE","Comic Sans MS","Trebuchet MS",sans-serif;color:var(--ink);
    background:linear-gradient(#25396b,#15213d)}
  .book{width:100%;max-width:680px;background:var(--card);border-radius:24px;padding:16px;
    box-shadow:0 12px 40px rgba(0,0,0,.45);border:6px solid #ffd27a}
  h1{margin:4px 0 10px;text-align:center;font-size:1.3rem;color:#6a4fb3}
  svg#scene{width:100%;height:auto;border-radius:16px;display:block;background:#123;touch-action:manipulation}
  [data-act]{cursor:pointer}
  #text{font-size:1.2rem;line-height:1.55;margin:14px 6px 6px;min-height:6.5em}
  #hint{text-align:center;color:#d6428a;font-weight:bold;min-height:1.4em;animation:bob 1.2s infinite}
  @keyframes bob{50%{transform:translateY(-4px)}}
  .choices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}
  button{font:inherit;border:0;border-radius:999px;padding:10px 18px;background:var(--blue);color:#fff;font-weight:bold;
    cursor:pointer;box-shadow:0 3px 0 #2a8fbf}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #2a8fbf}
  button.ch{background:#ffb74d;box-shadow:0 3px 0 #d58a1f}
  button:disabled{opacity:.35;cursor:not-allowed}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
  #dots{display:flex;gap:6px}
  #dots i{width:10px;height:10px;border-radius:50%;background:#ddd}
  #dots i.on{background:var(--pink)}
  #snd{position:fixed;top:12px;right:12px;padding:8px 12px;background:#fff;color:#333;box-shadow:none}
  .heart{font-size:22px;pointer-events:none;animation:up 1.4s ease-out forwards}
  @keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}
  .tw{animation:tw 2s infinite}
  .ffly{animation:ffd 4s ease-in-out infinite}
  @keyframes ffd{0%{transform:translate(0,0)}25%{transform:translate(5px,-6px)}50%{transform:translate(-4px,-10px)}75%{transform:translate(-6px,-3px)}100%{transform:translate(0,0)}}
  .ffg{animation:ffb 2.2s ease-in-out infinite}
  @keyframes ffb{0%,100%{opacity:.25}50%{opacity:1}}
  .ffa{animation:ffa 2.2s ease-in-out infinite}
  @keyframes ffa{0%,100%{fill:#7d8a36}50%{fill:#eaff6a}}
  .ffw{animation:ffw .1s infinite alternate;transform-box:fill-box;transform-origin:center bottom}
  @keyframes ffw{to{transform:scaleY(.55)}}
  .on .ffg{animation:none;opacity:1}
  .on .ffa{animation:none;fill:#fffde0}
  .sn{animation:sn 7s linear infinite}
  @keyframes sn{from{transform:translateY(-14px)}to{transform:translateY(274px)}}
  .shoot{animation:shoot 5.5s ease-in infinite}
  @keyframes shoot{0%{transform:translate(-30px,-14px);opacity:0}12%{opacity:1}55%{opacity:1}100%{transform:translate(150px,64px);opacity:0}}
  .spin{animation:spin 50s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fl{animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-4px)}}
  .pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{opacity:.5;transform:scale(1.12)}}
  @keyframes tw{50%{opacity:.35}}
</style>
</head>
<body>
<button id="snd" title="Ses aç/kapat">🔊</button>

<!-- ortak çizim araçları -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="ffGlow"><stop offset="0" stop-color="#f4ff9a" stop-opacity=".95"/><stop offset=".3" stop-color="#c8ff4a" stop-opacity=".5"/><stop offset="1" stop-color="#b6ff3a" stop-opacity="0"/></radialGradient>

    <linearGradient id="starG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8c2"/><stop offset=".55" stop-color="#ffd54f"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient>
    <radialGradient id="aura"><stop offset="0" stop-color="#bff3ff" stop-opacity=".85"/><stop offset=".35" stop-color="#5fc8ff" stop-opacity=".4"/><stop offset="1" stop-color="#5fc8ff" stop-opacity="0"/></radialGradient>

    <linearGradient id="hairD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0b10"/><stop offset="1" stop-color="#2b2b36"/></linearGradient>

  </defs>
</svg>

<main class="book">
  <h1>✨ Yuna ve Mina: OPTCAS'ın Sırrı ✨</h1>
  <svg id="scene" viewBox="0 0 400 260"></svg>
  <div id="hint"></div>
  <div id="text"></div>
  <div id="extra" class="choices"></div>
  <div class="nav">
    <button id="back">◀ Geri</button>
    <div id="dots"></div>
    <button id="next">İleri ▶</button>
  </div>
</main>

<script>
/* ---------- SES (hepsi tarayıcıda üretilir) ---------- */
let ac, musicOn = true, musicTimer = null;
function A(){ if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }
function tone(f,d=.3,type='sine',v=.15,t0=0,f2){
  if(!musicOn) return;
  const a=A(), o=a.createOscillator(), g=a.createGain(), t=a.currentTime+t0;
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.05);
}
const chime = () => { tone(880,.4,'sine',.15); tone(1320,.5,'sine',.1,.12); };
const meow  = () => { tone(520,.35,'triangle',.22,0,820); tone(820,.3,'triangle',.2,.3,430); };
const howl  = () => { tone(300,1.3,'sawtooth',.05,0,620); tone(450,1.1,'sine',.1,.1,700); tone(700,.8,'sine',.06,1,420); };
const pop   = () => tone(660,.15,'square',.07,0,990);
function startMusic(){
  if(musicTimer) return;
  const pent=[262,294,330,392,440,523,392,330];
  let k=0;
  musicTimer=setInterval(()=>{ tone(pent[k%pent.length],1.4,'sine',.045); if(k%4===0) tone(131,2,'sine',.05); k+= (Math.random()<.5?1:2); },650);
}
document.getElementById('snd').onclick = e => {
  musicOn=!musicOn; e.target.textContent = musicOn?'🔊':'🔇'; if(musicOn) startMusic();
};

/* ---------- MOTOR ---------- */
let cur = 0;
const $ = id => document.getElementById(id);
function val(v){ return typeof v==='function'?v():v; }
function render(){
  const p = pages[cur];
  $('scene').innerHTML = p.s();
  $('text').innerHTML = p.t();
  $('hint').textContent = val(p.h)||'';
  $('extra').innerHTML = p.x?p.x():'';
  $('back').disabled = cur===0;
  const locked = p.lock && p.lock();
  $('next').disabled = cur===pages.length-1 || locked;
  $('dots').innerHTML = pages.map((_,i)=>`<i class="${i===cur?'on':''}"></i>`).join('');
}
function say(){ // metni ve ipucunu yenile, sahneyi de
  const p=pages[cur]; $('scene').innerHTML=p.s(); $('text').innerHTML=p.t(); $('hint').textContent=val(p.h)||''; $('extra').innerHTML=p.x?p.x():'';
  $('next').disabled = cur===pages.length-1 || (p.lock && p.lock());
}
function floatHeart(evt, emoji){
  const svg=$('scene'), pt=svg.createSVGPoint(); pt.x=evt.clientX; pt.y=evt.clientY;
  const c=pt.matrixTransform(svg.getScreenCTM().inverse());
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x',c.x); t.setAttribute('y',c.y); t.setAttribute('class','heart'); t.setAttribute('font-size','22'); t.textContent=emoji;
  svg.appendChild(t); setTimeout(()=>t.remove(),1400);
}
function guess(i){
  pop();
  if(i===1){ state.solved=true; chime(); setTimeout(chime,250); say(); }
  else $('hint').textContent = i===0 ? '🕳️ Orası karanlık! OPTCAS karanlığı sevmez. Tekrar dene.' : '🪵 Orası kuru! OPTCAS suyu sever. Tekrar dene.';
}
function guess2(i){ pop(); if(i===1){ state.ice=true; chime(); setTimeout(chime,250); say(); } else $('hint').textContent = i===0 ? '⛄ Kartopu da soğuk! Daha sıcak bir şey bul.' : '🧊 Buz küpü kapıyı eritemez! Tekrar dene.'; }
$('scene').addEventListener('click', e=>{
  startMusic();
  const el = e.target.closest('[data-act]'); const p = pages[cur];
  if(el){
    const a = el.dataset.act;
    if(a==='howl'){ howl(); floatHeart(e,'🐺'); }
    else if(a==='meow'){ meow(); floatHeart(e,'🐱'); floatHeart({clientX:e.clientX+14,clientY:e.clientY},'💛'); }
    else if(a==='firefly'){ if(!el.dataset.on){ el.dataset.on=1; el.classList.add('on'); chime(); state.flies++; if(state.flies>=5){ setTimeout(say,200);} else $('hint').textContent=`👆 Ateş böceklerine dokun (${state.flies}/5)`; } }
    else if(a==='tattoo'){ if(!state.tattoo){ state.tattoo=true; chime(); meow(); say(); } }
    else if(a==='gap'){ if(!state.looked){ state.looked=true; chime(); say(); } }
    else if(a==='snowcat'){ meow(); floatHeart(e,'❄️'); if(!state.cat){ state.cat=true; chime(); say(); } }
    else if(a==='dragon'){ pop(); floatHeart(e,'💙'); }
    else if(a==='star'){ if(!state.back){ state.back=true; chime(); setTimeout(chime,250); setTimeout(()=>tone(1568,.6,'sine',.12),500); say(); } }
    else if(a==='wish'){ floatHeart(e,'⭐'); chime(); }
    else if(a==='optcas'){ if(!state.bloom){ state.bloom=true; chime(); setTimeout(chime,200); setTimeout(()=>tone(1568,.6,'sine',.12),400); say(); } }
    return;
  }
  if(p.tapAny){ pop(); floatHeart(e,p.tapAny); }
});
$('next').onclick = ()=>{ startMusic(); if(cur<pages.length-1){cur++;render();} };
$('back').onclick = ()=>{ if(cur>0){cur--;render();} };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'&&!$('next').disabled) $('next').click(); if(e.key==='ArrowLeft') $('back').click(); });
render();
window._ready = true;
</script>
